[project]
name = "ha-solar-sky"
version = "0.9.0"
description = "Home Assistant integration: cloud cover and a sky view from your solar panels' output"
requires-python = ">=3.13"
license = "MIT"

[dependency-groups]
test = ["pytest-homeassistant-custom-component"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]  # zip over arrays of equal length by construction
